[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checker"
version = "0.1.0"
description = "AI 中转站「掺水」黑盒检测器"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
stats = ["numpy>=1.26", "scipy>=1.11"]
dev = ["pytest>=8"]

[project.scripts]
checker = "checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
